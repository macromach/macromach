<text x="90" y="555" font-size="12" fill="#a8b8d0" letter-spacing="1">MCA · EXPECTED 2027</text>
<text x="1350" y="555" text-anchor="end" font-size="12" fill="#a8b8d0" letter-spacing="1">GITHUB.COM / MACROMACH</text>
