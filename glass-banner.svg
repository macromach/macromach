<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
<title id="title">Gokul L — Aspiring Software Developer</title>
<desc id="desc">Glass panels over a midnight background with cyan and violet light. Backend systems, web and mobile, AI automation. MCA expected 2027.</desc>
<defs>
  <radialGradient id="cyan"><stop stop-color="#22d3ee" stop-opacity=".65"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <radialGradient id="violet"><stop stop-color="#8b5cf6" stop-opacity=".7"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".14"/><stop offset=".5" stop-color="#cbd5ff" stop-opacity=".045"/><stop offset="1" stop-color="#fff" stop-opacity=".08"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".6"/><stop offset=".45" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#b4aaff" stop-opacity=".45"/></linearGradient>
  <linearGradient id="text"><stop stop-color="#a5f3fc"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient>
  <clipPath id="clip"><rect width="1440" height="620" rx="28"/></clipPath>
</defs>
<g clip-path="url(#clip)">
