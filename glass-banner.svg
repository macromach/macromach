<text x="84" y="272" font-size="96" font-weight="700" letter-spacing="-4" fill="#f8fafc">Gokul L<tspan fill="#a5f3fc">.</tspan></text>
<text x="91" y="321" font-size="30" fill="url(#text)">Aspiring Software Developer</text>
<text x="91" y="366" font-size="18" fill="#bac8df">Building APIs, applications, and useful automation.</text>
<g transform="translate(1030 167) rotate(8 125 90)">
